<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventoret · Il meglio di Torino ogni venerdì</title>
<meta name="description" content="Il meglio di Torino scelto per te. Ogni venerdì alle 7:30, il tempo di un caffè e hai i piani per il weekend.">
<style>
  @font-face { font-family: 'Young Serif'; src: url(/young-serif.woff2) format('woff2'); font-display: swap; }
  :root { --verde: #183F2E; --giallo: #DDA137; --portici: #F2EFE8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--verde); color: var(--portici); font: 17px/1.5 Arial, Helvetica, sans-serif; }
  a { color: var(--giallo); }
  :focus-visible { outline: 3px solid var(--giallo); outline-offset: 2px; }

  .pagina { display: grid; min-height: 100vh; }

  /* La foto: la Mole al tramonto con le Alpi. */
  .foto {
    position: relative; display: flex; flex-direction: column; min-height: 78svh; padding: 1.5rem 1.25rem 2.5rem;
    background: linear-gradient(180deg, rgba(22,16,38,.7) 0%, rgba(22,16,38,.25) 45%, rgba(22,16,38,0) 65%, rgba(24,63,46,.9) 100%),
                url(/mole.jpg) 42% 100% / cover #2b2338;
  }
  .foto img { width: 170px; height: auto; }
  h1 {
    font: 400 clamp(2.4rem, 9vw, 4.6rem)/1.05 'Young Serif', Georgia, serif; letter-spacing: -.01em;
    max-width: 11ch; margin: 1.75rem 0 0; text-wrap: balance; text-shadow: 0 2px 18px rgba(22,16,38,.6);
  }
  .credito { margin: 3rem 0 0; font-size: .7rem; opacity: .5; text-align: center; }
  .credito a { color: inherit; }

  /* Il pannello col form. */
  .iscrizione { padding: 2rem 1.25rem 3rem; }
  .iscrizione > div { max-width: 26rem; margin: 0 auto; }
  .promessa { font-size: 1.2rem; margin: 0 0 1.75rem; }
  label { display: block; margin: 1.1rem 0; }
  input[type=email], select {
    display: block; width: 100%; margin-top: .4rem; padding: .8rem .9rem; font: inherit; color: var(--verde);
    background: var(--portici); border: 0; border-radius: 6px;
  }
  .casella { display: flex; gap: .7rem; align-items: flex-start; font-size: .95rem; }
  .casella input { width: 1.25rem; height: 1.25rem; margin: .15rem 0 0; flex: none; accent-color: var(--giallo); }
  small { opacity: .8; font-size: .9rem; }
  button {
    width: 100%; margin-top: .75rem; padding: 1rem; font: 1.3rem 'Young Serif', Georgia, serif; color: var(--verde);
    background: var(--giallo); border: 0; border-radius: 6px; cursor: pointer; transition: background .15s;
  }
  button:hover { background: #e8b55a; }
  .nota { margin: .9rem 0 0; font-size: .9rem; opacity: .8; text-align: center; }

  @media (min-width: 900px) {
    .pagina { grid-template-columns: 1fr minmax(26rem, 34rem); }
    .foto { min-height: 100vh; padding: 2.5rem 3rem; background-position: 12% 100%; position: sticky; top: 0; height: 100vh; }
    .foto img { width: 220px; }
    h1 { margin-top: 3.5rem; }
    .iscrizione { display: flex; align-items: center; padding: 3rem; }
    .iscrizione > div { width: 100%; }
  }
</style>
</head>
<body>
<div class="pagina">
  <header class="foto">
    <img src="/wordmark-chiaro.svg" alt="Eventoret">
    <h1>Il meglio di Torino scelto per te.</h1>
  </header>

  <main class="iscrizione"><div>
    <p class="promessa">Ogni venerdì alle 7:30, il tempo di un caffè e hai i piani per il weekend.</p>

    <!-- Form "Landing eventoret.it" su Kit, senza lo script di Kit: niente cookie. -->
    <form action="https://app.kit.com/forms/10076686/subscriptions" method="post">
      <label>La tua email
        <input type="email" name="email_address" required autocomplete="email">
      </label>

      <!-- Senza name: il browser le rende obbligatorie, a Kit non arrivano. -->
      <label class="casella"><input type="checkbox" required> <span>Ho almeno 18 anni.</span></label>
      <label class="casella"><input type="checkbox" required> <span>Voglio ricevere Eventoret ogni venerdì. Il Numero può contenere sponsor e link affiliati; misuriamo aperture e click. <a href="/privacy">Informativa privacy</a></span></label>

      <label>Come hai scoperto Eventoret? <small>(facoltativo)</small>
        <select name="fields[come]">
          <option value="">—</option>
          <option value="amico">Un amico me l'ha consigliato / inoltrato</option>
          <option value="community">Una community o un gruppo</option>
          <option value="instagram">Instagram</option>
          <option value="google">Google</option>
          <option value="altro">Altro</option>
        </select>
      </label>

      <input type="hidden" name="fields[fonte]">

      <button type="submit">Iscriviti</button>
      <p class="nota">Ti mando un'email per confermare l'iscrizione.</p>
    </form>

    <!-- La licenza CC BY-SA della foto chiede di citare l'autore. -->
    <p class="credito">Foto: <a href="https://commons.wikimedia.org/wiki/File:Mole_Antonelliana_di_sera.jpg">Abbrey82</a>, <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.it">CC BY-SA 4.0</a></p>
  </div></main>
</div>

<script>
  // Niente cookie: legge solo utm_source dall'URL.
  const utm = new URLSearchParams(location.search).get('utm_source') || '';
  const form = document.forms[0];
  form['fields[fonte]'].value = utm;
  const come = form['fields[come]'];
  if ([...come.options].some(o => o.value === utm.toLowerCase())) come.value = utm.toLowerCase();
</script>
</body>
</html>
